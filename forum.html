<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madar LMS | Announcements</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero { margin-top: 70px; background-color: var(--bg-primary); padding: 80px 24px 60px; border-bottom: 1px solid var(--border-color); background-image: radial-gradient(var(--border-color) 1px, transparent 1px); background-size: 24px 24px; text-align: center; }
    .hero-title { font-family: var(--font-heading); font-size: 2.75rem; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
    .forum-badge { display: inline-flex; align-items: center; gap: 6px; background-color: var(--brand-black); color: var(--white); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(60, 50, 30, 0.1); }

    .portal-container { max-width: 800px; margin: -20px auto 60px; padding: 0 24px; position: relative; z-index: 10; }

    .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--bg-tertiary); }
    .post-subject { font-family: var(--font-heading); font-weight: 600; font-size: 1.2rem; }
    .post-meta { font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .post-body { font-size: 0.95rem; color: var(--text-secondary); white-space: pre-wrap; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header>
    <div class="nav-container">
      <div class="back-link" onclick="history.back()"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Back to Modules</div>
      <div style="font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; color: var(--brand-black);">COMMUNICATIONS</div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    </div>
  </header>
  
  <div id="hero-container">
    <section class="hero">
      <div class="forum-badge"><i data-lucide="message-square" style="width: 14px; height: 14px;"></i> Initializing</div>
      <h1 class="hero-title">Loading...</h1>
    </section>
  </div>

  <div class="portal-container" id="main-content">
    <div class="loading-state">
      <i data-lucide="loader-2" style="animation: spin 2s linear infinite; margin: 0 auto 12px; display: block; width: 32px; height: 32px; color: var(--brand-black);"></i>
      Fetching announcements...
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <script>
    lucide.createIcons();
    const userToken = getUserToken();
    requireAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const forumId = urlParams.get('forumid');
    const courseId = urlParams.get('courseid');

    async function loadForum() {
      const container = document.getElementById('main-container');
      const heroContainer = document.getElementById('hero-container');
      try {
        const forumData = await moodleRequest('mod_forum_get_forums_by_courses', { 'courseids[0]': courseId });
        const forum = forumData.find(f => f.id == forumId);

        heroContainer.innerHTML = `
          <section class="hero">
            <div class="forum-badge"><i data-lucide="radio" style="width: 14px; height: 14px;"></i> Broadcast Center</div>
            <h1 class="hero-title">${forum ? forum.name : 'Announcements'}</h1>
          </section>
        `;
        lucide.createIcons();

        const discData = await moodleRequest('mod_forum_get_forum_discussions', { forumid: forumId });

        let html = ``;
        if (!discData.discussions || discData.discussions.length === 0) {
          html = `<div class="post-card"><div class="post-body" style="text-align: center;">No announcements have been posted yet.</div></div>`;
        } else {
          discData.discussions.forEach(post => {
            const dateStr = new Date(post.created * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            html += `
              <div class="post-card">
                <div class="post-header">
                  <div class="post-subject">${post.subject}</div>
                  <div class="post-meta"><i data-lucide="user" style="width: 14px; height: 14px;"></i> ${post.userfullname} &nbsp;&bull;&nbsp; ${dateStr}</div>
                </div>
                <div class="post-body">${post.message}</div>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        lucide.createIcons();
      } catch (e) {
        container.innerHTML = `<div class="loading-state" style="color: #dc2626;">Error loading forum data.</div>`;
      }
    }
    loadForum();
  </script>
</body>
</html>
