<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madar LMS | Announcements</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg-primary: #ffffff; --bg-secondary: #f4f4f5; --bg-tertiary: #e4e4e7; --text-primary: #000000; --text-secondary: #52525b; --border-color: #d4d4d8; --black: #09090b; --font-heading: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background-color: var(--bg-secondary); color: var(--text-primary); }
    header { background-color: var(--bg-primary); border-bottom: 1px solid var(--border-color); position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
    .nav-container { max-width: 800px; margin: 0 auto; padding: 0 24px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
    .portal-container { max-width: 800px; margin: 100px auto 40px; padding: 0 24px; }
    .forum-title { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; margin-bottom: 24px; }
    .post-card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 24px; margin-bottom: 16px; }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid var(--bg-secondary); padding-bottom: 12px; }
    .post-subject { font-weight: 600; font-size: 1.1rem; }
    .post-meta { font-size: 0.85rem; color: var(--text-secondary); }
    .post-body { font-size: 0.95rem; line-height: 1.6; color: var(--text-secondary); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="back-link" onclick="history.back()"><i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i> Back to Modules</div>
      <div style="font-family: var(--font-heading); font-weight: 700; text-transform: uppercase;">Communications</div>
    </div>
  </header>
  <div class="portal-container" id="main-container">
    <div style="text-align: center; padding: 60px;">
      <i data-lucide="loader-2" style="animation: spin 2s linear infinite; margin: 0 auto 10px; display: block;"></i> Loading announcements...
    </div>
  </div>
  <script>
    lucide.createIcons();
    const MOODLE_URL = 'http://localhost:8000';
    const userToken = localStorage.getItem('madar_user_token');
    const urlParams = new URLSearchParams(window.location.search);
    const forumId = urlParams.get('forumid');
    const courseId = urlParams.get('courseid');

    async function loadForum() {
      const container = document.getElementById('main-container');
      try {
        // Fetch Forum info
        const forumRes = await fetch(`${MOODLE_URL}/webservice/rest/server.php?wstoken=${userToken}&wsfunction=mod_forum_get_forums_by_courses&courseids[0]=${courseId}&moodlewsrestformat=json`);
        const forumData = await forumRes.json();
        const forum = forumData.find(f => f.id == forumId);

        // Fetch Discussions
        const discRes = await fetch(`${MOODLE_URL}/webservice/rest/server.php?wstoken=${userToken}&wsfunction=mod_forum_get_forum_discussions&forumid=${forumId}&moodlewsrestformat=json`);
        const discData = await discRes.json();

        let html = `<h1 class="forum-title">${forum ? forum.name : 'Announcements'}</h1>`;

        if (!discData.discussions || discData.discussions.length === 0) {
          html += `<div class="post-card"><div class="post-body">No announcements have been posted yet.</div></div>`;
        } else {
          discData.discussions.forEach(post => {
            const dateStr = new Date(post.created * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            html += `
              <div class="post-card">
                <div class="post-header">
                  <div class="post-subject">${post.subject}</div>
                  <div class="post-meta">By ${post.userfullname} &bull; ${dateStr}</div>
                </div>
                <div class="post-body">${post.message}</div>
              </div>
            `;
          });
        }
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<div class="post-card" style="color: #dc2626;">Error loading forum data.</div>`;
      }
    }
    loadForum();
  </script>
</body>
</html>
