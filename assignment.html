<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madar LMS | Submission Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f8fafc; --bg-tertiary: #f1f5f9;
      --text-primary: #09090b; --text-secondary: #52525b;
      --border-color: #e2e8f0; --brand-black: #000000; --white: #ffffff;
      --font-heading: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background-color: var(--bg-secondary); color: var(--text-primary); line-height: 1.6; }
    
    header { background-color: rgba(255, 255, 255, 0.95); border-bottom: 1px solid var(--border-color); position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(8px); }
    .nav-container { max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .back-link:hover { color: var(--brand-black); }

    .hero { margin-top: 70px; background-color: var(--bg-primary); padding: 80px 24px 40px; border-bottom: 1px solid var(--border-color); background-image: radial-gradient(var(--border-color) 1px, transparent 1px); background-size: 24px 24px; }
    .hero-content { max-width: 800px; margin: 0 auto; }
    .assign-title { font-family: var(--font-heading); font-size: 2.25rem; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
    .meta-tags { display: flex; gap: 12px; flex-wrap: wrap; }
    .meta-tag { display: inline-flex; align-items: center; gap: 6px; background-color: var(--brand-black); color: var(--white); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .meta-tag.status-tag { background-color: var(--bg-tertiary); color: var(--text-primary); box-shadow: none; border: 1px solid var(--border-color); }

    .portal-container { max-width: 800px; margin: -20px auto 60px; padding: 0 24px; position: relative; z-index: 10; }
    .panel { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.02); }
    .panel-title { font-family: var(--font-heading); font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--bg-tertiary); }
    .instructions-content { font-size: 0.95rem; color: var(--text-secondary); }

    .upload-zone { border: 2px dashed var(--border-color); border-radius: 8px; padding: 40px 20px; text-align: center; background-color: var(--bg-secondary); cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
    .upload-zone:hover { border-color: var(--brand-black); background-color: var(--bg-tertiary); }
    .upload-icon { margin: 0 auto 12px; color: var(--brand-black); }
    
    .submit-btn { display: block; width: 100%; padding: 16px; background-color: var(--brand-black); color: var(--white); border: none; border-radius: 8px; font-family: var(--font-heading); font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.99); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="back-link" onclick="history.back()"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Back to Modules</div>
      <div style="font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; color: var(--brand-black);">SUBMISSION PORTAL</div>
    </div>
  </header>
  
  <section class="hero">
    <div class="hero-content">
      <h1 class="assign-title" id="assign-title">Loading Assignment...</h1>
      <div class="meta-tags" id="assign-meta">
        <div class="meta-tag"><i data-lucide="clock" style="width: 14px; height: 14px;"></i> Fetching data...</div>
      </div>
    </div>
  </section>

  <div class="portal-container" id="main-container">
    <div class="panel">
      <h2 class="panel-title">Instructions</h2>
      <div class="instructions-content" id="assign-instructions">Please wait...</div>
    </div>
    
    <div class="panel">
      <h2 class="panel-title">Upload Submission</h2>
      <div class="upload-zone" id="drop-zone">
        <i data-lucide="cloud-upload" class="upload-icon" style="width: 40px; height: 40px;"></i>
        <div style="font-weight: 600; margin-bottom: 4px;">Click to browse or drag file here</div>
        <div style="font-size: 0.85rem; color: var(--text-secondary);">Accepts .cpp, .py, .pdf, .zip (Max 50MB)</div>
      </div>
      <input type="file" id="file-input" style="display: none;">
      <button class="submit-btn" id="submit-btn">Transmit to Moodle</button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const MOODLE_URL = 'http://localhost:8000';
    const userToken = localStorage.getItem('madar_user_token');
    const urlParams = new URLSearchParams(window.location.search);
    const assignId = urlParams.get('assignid');
    const courseId = urlParams.get('courseid');

    async function loadAssignment() {
      try {
        const res = await fetch(`${MOODLE_URL}/webservice/rest/server.php?wstoken=${userToken}&wsfunction=mod_assign_get_assignments&courseids[0]=${courseId}&moodlewsrestformat=json`);
        const data = await res.json();
        const assign = data.courses[0].assignments.find(a => a.id == assignId);
        
        if(assign) {
          document.getElementById('assign-title').textContent = assign.name;
          document.getElementById('assign-instructions').innerHTML = assign.intro || 'No specific instructions provided. Submit your files below.';
          
          const dueDate = new Date(assign.duedate * 1000).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          
          document.getElementById('assign-meta').innerHTML = `
            <div class="meta-tag"><i data-lucide="calendar" style="width: 14px; height: 14px;"></i> Due: ${dueDate}</div>
            <div class="meta-tag status-tag"><i data-lucide="check-circle" style="width: 14px; height: 14px;"></i> Status: Pending</div>
          `;
          lucide.createIcons();
        }
      } catch (e) {
        document.getElementById('assign-title').textContent = "Error Loading Data";
      }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    dropZone.addEventListener('click', () => fileInput.click());

    loadAssignment();
  </script>
</body>
</html>
