<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Madar LMS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f4f5;
      --text-primary: #000000;
      --text-secondary: #52525b;
      --border-color: #d4d4d8;
      --black: #09090b;
      --white: #ffffff;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background-image: 
        linear-gradient(var(--bg-secondary) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-secondary) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .register-container {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-text {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--black);
    }

    .password-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .register-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--black);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .register-btn:hover {
      opacity: 0.9;
    }

    .feedback-msg {
      font-size: 0.85rem;
      margin-top: 16px;
      text-align: center;
      display: none;
      padding: 10px;
      border-radius: 4px;
    }

    .feedback-msg.error {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #f87171;
    }

    .feedback-msg.success {
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #86efac;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .login-link a {
      color: var(--black);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="brand">
      <i data-lucide="triangle" style="width: 32px; height: 32px; fill: var(--black);"></i>
      <span class="brand-text">Madar LMS</span>
    </div>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 32px; font-size: 0.95rem;">Create your student account.</p>

    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" required>
        </div>
        <div class="form-group">
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <div class="password-hint">Min. 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special character (*,-,#).</div>
      </div>

      <button type="submit" class="register-btn" id="submitBtn">
        <span>Create Account</span>
        <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
      </button>

      <div id="feedbackMessage" class="feedback-msg"></div>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    lucide.createIcons();

    // Configuration
    const MOODLE_URL = 'http://localhost:8000';
    // VERY IMPORTANT: Paste your master admin token from Phase 1 here.
    const ADMIN_TOKEN = '8d84d68985a2c62a0de3c3015677c741'; 

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      const submitBtn = document.getElementById('submitBtn');
      const feedbackDiv = document.getElementById('feedbackMessage');
      
      // Collect user data
      const fname = document.getElementById('firstname').value;
      const lname = document.getElementById('lastname').value;
      const email = document.getElementById('email').value;
      const uname = document.getElementById('username').value.toLowerCase(); // Moodle prefers lowercase usernames
      const pword = document.getElementById('password').value;

      // UI Loading State
      feedbackDiv.style.display = 'none';
      feedbackDiv.className = 'feedback-msg';
      submitBtn.innerHTML = '<i data-lucide="loader-2" style="animation: spin 2s linear infinite;"></i> Processing...';
      lucide.createIcons();

      try {
        // Build Moodle REST parameters for core_user_create_users
        const url = new URL(`${MOODLE_URL}/webservice/rest/server.php`);
        url.searchParams.append('wstoken', ADMIN_TOKEN);
        url.searchParams.append('wsfunction', 'core_user_create_users');
        url.searchParams.append('moodlewsrestformat', 'json');
        
        // Moodle requires user data as an indexed array in the URL
        url.searchParams.append('users[0][username]', uname);
        url.searchParams.append('users[0][password]', pword);
        url.searchParams.append('users[0][firstname]', fname);
        url.searchParams.append('users[0][lastname]', lname);
        url.searchParams.append('users[0][email]', email);

        const response = await fetch(url, { method: 'POST' });
        const data = await response.json();

        // Moodle returns an array of created users on success, or an exception object on failure
        if (data.exception) {
          throw new Error(data.message);
        }

        // SUCCESS STATE
        feedbackDiv.className = 'feedback-msg success';
        feedbackDiv.innerHTML = 'Account created successfully! Redirecting to login...';
        feedbackDiv.style.display = 'block';
        
        // Redirect to login page after 2 seconds
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        console.error('Registration Error:', error);
        
        // ERROR STATE
        feedbackDiv.className = 'feedback-msg error';
        feedbackDiv.innerHTML = error.message;
        feedbackDiv.style.display = 'block';
        
        // Reset Button UI
        submitBtn.innerHTML = '<span>Create Account</span><i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
