<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>athena | Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f4f5;
      --bg-tertiary: #e4e4e7;
      --text-primary: #000000;
      --text-secondary: #52525b;
      --text-tertiary: #71717a;
      --border-color: #d4d4d8;
      --black: #09090b;
      --white: #ffffff;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background-color: var(--bg-secondary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 420px; padding: 40px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center; }
    .brand-icon { color: var(--black); display: flex; }
    .brand-text { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; text-transform: uppercase; }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.5px; }
    .form-input { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px; font-family: var(--font-body); font-size: 0.95rem; color: var(--text-primary); outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--black); background: var(--bg-primary); }

    .submit-btn { width: 100%; padding: 14px; background-color: var(--black); color: var(--white); border: none; border-radius: 4px; font-family: var(--font-heading); font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
    .submit-btn:hover { opacity: 0.9; }

    .error-msg { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 20px; display: none; text-align: center; }
    
    .register-footer { margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 20px; }
    .register-footer a { color: var(--black); font-weight: 600; text-decoration: none; }
    .register-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="triangle" style="width: 32px; height: 32px; fill: var(--black);"></i></div>
      <span class="brand-text">athena</span>
    </div>

    <div id="error-box" class="error-msg">Invalid credentials. Please try again.</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-input" required placeholder="Enter your username">
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" required placeholder="Enter your password">
      </div>

      <button type="submit" id="login-btn" class="submit-btn">Sign In</button>
    </form>

    <div class="register-footer">
      Don't have an account? <a href="register.html">Create account</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const MOODLE_URL = 'http://localhost:8000';

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('error-box');
      const loginBtn = document.getElementById('login-btn');

      errorBox.style.display = 'none';
      loginBtn.textContent = 'Authenticating...';

      try {
        const response = await fetch(`${MOODLE_URL}/login/token.php?service=moodle_mobile_app&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        const data = await response.json();

        if (data.token) {
          localStorage.setItem('madar_user_token', data.token);
          localStorage.setItem('madar_username', username);
          window.location.href = 'index.html';
        } else {
          throw new Error(data.error || 'Authentication failed');
        }
      } catch (err) {
        errorBox.style.display = 'block';
        errorBox.textContent = err.message || 'Could not connect to Moodle backend.';
        loginBtn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
