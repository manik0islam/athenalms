<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madar LMS | File Resource</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f8fafc; --bg-tertiary: #f1f5f9;
      --text-primary: #09090b; --text-secondary: #52525b;
      --border-color: #e2e8f0; --brand-black: #000000; --white: #ffffff;
      --font-heading: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background-color: var(--bg-secondary); color: var(--text-primary); }
    
    header { background-color: rgba(255, 255, 255, 0.95); border-bottom: 1px solid var(--border-color); position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(8px); }
    .nav-container { max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .back-link:hover { color: var(--brand-black); }

    .portal-container { max-width: 800px; margin: 140px auto 60px; padding: 0 24px; display: flex; justify-content: center; }
    
    .file-card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; padding: 48px 40px; text-align: center; width: 100%; max-width: 480px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.02); }
    .file-icon { width: 72px; height: 72px; margin: 0 auto 24px; color: var(--brand-black); background: var(--bg-tertiary); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .file-name { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 600; margin-bottom: 8px; word-break: break-all; }
    .file-meta { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .download-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; background-color: var(--brand-black); color: var(--white); border-radius: 8px; font-family: var(--font-heading); font-weight: 600; font-size: 1rem; text-decoration: none; transition: transform 0.1s, opacity 0.2s; }
    .download-btn:hover { opacity: 0.9; }
    .download-btn:active { transform: scale(0.99); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="back-link" onclick="history.back()"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Back to Modules</div>
      <div style="font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; color: var(--brand-black);">RESOURCE VIEWER</div>
    </div>
  </header>

  <div class="portal-container" id="main-container">
    <div class="file-card" style="padding: 60px;">
      <i data-lucide="loader-2" style="animation: spin 2s linear infinite; margin: 0 auto 12px; display: block; width: 32px; height: 32px; color: var(--brand-black);"></i>
      <div style="color: var(--text-secondary);">Locating file...</div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const MOODLE_URL = 'http://localhost:8000';
    const userToken = localStorage.getItem('madar_user_token');
    const urlParams = new URLSearchParams(window.location.search);
    const resourceId = urlParams.get('resourceid');
    const courseId = urlParams.get('courseid');

    async function loadResource() {
      const container = document.getElementById('main-container');
      try {
        const res = await fetch(`${MOODLE_URL}/webservice/rest/server.php?wstoken=${userToken}&wsfunction=mod_resource_get_resources_by_courses&courseids[0]=${courseId}&moodlewsrestformat=json`);
        const data = await res.json();
        
        const fileData = data.resources.find(r => r.id == resourceId);
        if (!fileData || !fileData.contentfiles || fileData.contentfiles.length === 0) throw new Error("File not found");

        const targetFile = fileData.contentfiles[0];
        const downloadUrl = targetFile.fileurl + (targetFile.fileurl.includes('?') ? '&' : '?') + 'token=' + userToken;
        
        const sizeKB = (targetFile.filesize / 1024).toFixed(1);
        const sizeStr = sizeKB > 1024 ? (sizeKB / 1024).toFixed(2) + ' MB' : sizeKB + ' KB';

        container.innerHTML = `
          <div class="file-card">
            <div class="file-icon"><i data-lucide="file-text" style="width: 36px; height: 36px;"></i></div>
            <h2 class="file-name">${targetFile.filename}</h2>
            <div class="file-meta">
              <span style="background: var(--bg-tertiary); padding: 2px 8px; border-radius: 4px; font-weight: 500; font-size: 0.8rem; color: var(--text-primary);">Document</span> 
              &bull; ${sizeStr}
            </div>
            <a href="${downloadUrl}" target="_blank" class="download-btn">
              <i data-lucide="download" style="width: 18px; height: 18px;"></i> Download File
            </a>
          </div>
        `;
        lucide.createIcons();
      } catch (e) {
        container.innerHTML = `<div class="file-card" style="color: #dc2626;">Error: Could not locate the requested resource.</div>`;
      }
    }
    loadResource();
  </script>
</body>
</html>
